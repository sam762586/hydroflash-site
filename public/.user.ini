; HYDROFLASH — réglages PHP du formulaire (envoi-demande.php), lus par PHP-FPM/CGI sur la plupart des
; hébergements mutualisés (prise en compte sous 5 minutes environ). Si l'hébergeur ne lit pas ce fichier,
; appliquer les mêmes valeurs dans son panneau de configuration PHP. Fichier inaccessible depuis le web (.htaccess).
upload_max_filesize = 9M
post_max_size = 10M
max_file_uploads = 1
memory_limit = 256M
max_execution_time = 30
display_errors = Off
log_errors = On

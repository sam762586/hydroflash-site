# Déploiement automatique du site HYDROFLASH vers l'hébergement OVH.
# Se déclenche à chaque modification envoyée sur la branche main.
name: Mise en ligne HYDROFLASH

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi un lancement manuel depuis GitHub

concurrency:
  group: deploiement-ovh
  cancel-in-progress: false

jobs:
  construire-et-envoyer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build
        # Préproduction tant que les mentions légales ne sont pas renseignées.
        # Le jour du passage en production : remplacer par "npm run build:prod"
        # et supprimer l'étape « Protection préproduction » ci-dessous.

      # Tant que la société n'a pas de SIRET, le site est privé : accès par mot de
      # passe (identifiant « hydroflash ») et invisible des moteurs de recherche.
      # Le jour de l'immatriculation, supprimer cette étape et la ligne « put »
      # de l'étape suivante : le site devient public et référençable.
      #
      # Ci-dessous une empreinte bcrypt de coût 12 : le mot de passe en clair
      # n'est nulle part dans le dépôt et ne peut pas être retrouvé à partir
      # d'elle. Pour le changer, regénérer la ligne avec :
      #   htpasswd -nbB hydroflash "<nouveau mot de passe>"
      - name: Préproduction (mot de passe + noindex)
        run: |
          echo 'hydroflash:$2y$12$KNCcghV4Z2n6nACo2hrE6ejqnceKBMzoABY8QpNbByfy771Hu5lau' > .htpasswd-hydroflash
          python3 - <<'PY'
          p = 'dist/.htaccess'
          s = open(p, encoding='utf-8').read()
          bloc = """# --- PRÉPRODUCTION : accès protégé par mot de passe ---
          AuthType Basic
          AuthName "HYDROFLASH - site en preparation"
          AuthUserFile /home/uzdjkzv/.htpasswd-hydroflash
          Require valid-user
          <If "%{REQUEST_URI} =~ m#^/\\.well-known/#">
            Require all granted
          </If>
          # --- fin du bloc préproduction ---

          """
          bloc = '\n'.join(l[10:] if l.startswith(' ' * 10) else l for l in bloc.split('\n'))
          ancre = 'Options -Indexes -MultiViews'
          assert ancre in s, 'ancre .htaccess absente'
          s = s.replace(ancre, bloc + ancre, 1)
          a = '  # Header always set X-Robots-Tag "noindex, nofollow"'
          assert a in s, 'ligne X-Robots-Tag absente'
          s = s.replace(a, '  Header always set X-Robots-Tag "noindex, nofollow"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('Mot de passe et noindex appliques')
          PY

      - name: Envoyer sur OVH par SFTP
        env:
          MDP_FTP: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            open -u uzdjkzv,'$MDP_FTP' sftp://ftp.cluster129.hosting.ovh.net;
            put -O . .htpasswd-hydroflash;
            mirror -R --delete --parallel=4 --verbose=1 dist/ www/;
          "

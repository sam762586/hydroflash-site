# Déploiement automatique du site HYDROFLASH vers l'hébergement OVH.
# Se déclenche à chaque modification envoyée sur la branche main.
name: Mise en ligne HYDROFLASH

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi un lancement manuel depuis GitHub

concurrency:
  group: deploiement-ovh
  cancel-in-progress: false

jobs:
  construire-et-envoyer:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build
        # Préproduction tant que les mentions légales ne sont pas renseignées.
        # Le jour du passage en production : remplacer par "npm run build:prod"
        # et supprimer l'étape « Protection préproduction » ci-dessous.

      # Tant que la société n'a pas de SIRET, le site est en ligne mais invisible
      # des moteurs de recherche (balise noindex). Pour le rendre référençable le
      # jour de l'immatriculation : supprimer cette étape.
      #
      # Pour remettre un accès par mot de passe, réinsérer dans dist/.htaccess,
      # avant « Options -Indexes », un bloc AuthType Basic pointant vers un
      # fichier .htpasswd déposé dans le dossier personnel du serveur.
      - name: Préproduction (invisible des moteurs de recherche)
        run: |
          python3 - <<'PY'
          p = 'dist/.htaccess'
          s = open(p, encoding='utf-8').read()
          a = '  # Header always set X-Robots-Tag "noindex, nofollow"'
          assert a in s, 'ligne X-Robots-Tag absente'
          s = s.replace(a, '  Header always set X-Robots-Tag "noindex, nofollow"', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print('noindex applique, aucun mot de passe')
          PY

      - name: Envoyer sur OVH par SFTP
        env:
          MDP_FTP: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
            set sftp:auto-confirm yes;
            set net:max-retries 3;
            set net:timeout 30;
            open -u uzdjkzv,'$MDP_FTP' sftp://ftp.cluster129.hosting.ovh.net;
            mirror -R --delete --parallel=4 --verbose=1 dist/ www/;
          "
